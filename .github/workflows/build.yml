name: Build

on:
  pull_request: {}
  push:
    branches:
      - main

jobs:
  # Build Go binary on PRs and main
  build-binary:
    name: Build Binary
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: make build

  # Build and publish Docker images ONLY on main branch pushes
  build-docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docker.yml
    with:
      publish: true
